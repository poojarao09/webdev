<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 To-Do List</h1>
            <p class="subtitle">Stay organized, stay productive</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <button id="addTaskBtn" class="add-btn">Add Task</button>
        </div>

        <p id="errorMsg" class="error-msg">Please enter a task!</p>

        <ul id="taskList" class="task-list"></ul>

        <div id="taskCounter" class="task-counter">
            <span id="pendingCount">0 tasks pending</span>
            <span id="completedCount">0 completed</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
